# Profile-specific layout and collection; shared content lives in organization.toml.

schema_version = 1

[profile]
variant = "organization"
username = "doka-labs"
display_name = "doka-labs"
organization = "doka-labs"
headline = "Libraries and tools for .NET and relational databases."
tagline = "Libraries and tools for .NET and relational databases."
pages_url = "https://doka-labs.github.io/.github/"
source_url = "https://github.com/doka-labs/.github"

[collection]
nuget_owner = "doka-labs"
github_organizations = ["doka-labs"]
discover_public_repositories = true
visualize_discovered_repositories = false
include_forks = false
include_archived = false
collect_contributions = false
collect_private_repository_count = false
repository_limit = 100
history_limit = 24

[render]
width = 1800
height = 1552
motion_seconds = 32
detail_level = "abstract"
show_activity_orbit = true
show_state_hash = false
show_interests_in_readme = false
show_technology_labels = true

[presentation]
main_stack = ["C#", ".NET", "EF Core"]
supporting_stack = ["MySQL", "MariaDB", "PostgreSQL", "SQLite", "SQL Server"]

[[imports]]
id = "doka-labs"
source = { kind = "local", path = "organization.toml" }

[layout.radii]
"project:doka-labs/mysql" = 48.0
"project:doka-labs/nested-set" = 48.0
"project:doka-labs/relational-lab" = 42.0
"project:doka-labs/safe-migrations" = 51.0

[layout.weights]
"project:doka-labs/mysql" = 0.8
"project:doka-labs/nested-set" = 0.8
"project:doka-labs/relational-lab" = 0.8
"project:doka-labs/safe-migrations" = 0.8

